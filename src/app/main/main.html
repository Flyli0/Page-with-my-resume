
<div id = "back">
  <video autoplay #bgVideo muted loop playsinline preload = "auto" class = "background-video" (loadeddata)="onLoaded()">
    <source src = "p3rHigher.mp4" type = "video/mp4">
  </video>
  <h1>MAIN PAGE</h1>
  <div id = "info">
    @for(word of words;track $index){
      <a class = "word" [style.transform] = "word.transform" [routerLink] = 'word.RouterLink'>
        <button><div class = "textButton">
          <span class="text red">{{word.word}}</span>
          <span class="text gray">{{word.word}}</span>

        </div>
          <div id = "triangle"></div>
          <div id = "triangle2"></div>
        </button>
      </a>
    }
  </div>
  <footer>
    bibibibibibibbi
  </footer>
</div>
<router-outlet></router-outlet>
