
<div id = "back">
  <video autoplay muted loop playsinline class = "background-video">
    <source src = "p3rHigher.mp4" type = "video/mp4">
  </video>
  <h1>MAIN PAGE</h1>
  <div id = "info">
    @for(word of words;track $index){
      <div class = "word" [style.transform] = "word.transform" >
        <button><div class = "textButton">
          <span class="text red">{{word.word}}</span>
          <span class="text gray">{{word.word}}</span>

        </div>
          <div id = "triangle"></div>
          <div id = "triangle2"></div>
        </button>
      </div>
    }
  </div>
  <footer>
    bibibibibibibbi
  </footer>
</div>
